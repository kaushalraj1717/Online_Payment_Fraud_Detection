<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fraud Detection Dashboard</title>
    <style>
        :root {
            --bg-start: #0b1020;
            --bg-end: #111827;
            --panel-bg: rgba(15, 23, 42, 0.82);
            --card-bg: rgba(30, 41, 59, 0.8);
            --text: #ecf3ff;
            --muted: #cbd5e1;
            --border: rgba(148, 163, 184, 0.25);
            --button1: #f59e0b;
            --button2: #ef4444;
            --input-bg: rgba(15, 23, 42, 0.95);
            --toggle-bg: #e2e8f0;
            --toggle-dot: #0f172a;
            --shadow: rgba(0,0,0,0.22);
        }

        body.light-mode {
            --bg-start: #eef6ff;
            --bg-end: #dbeafe;
            --panel-bg: rgba(255, 255, 255, 0.8);
            --card-bg: rgba(255, 255, 255, 0.8);
            --text: #0f172a;
            --muted: #475569;
            --border: rgba(59, 130, 246, 0.15);
            --input-bg: rgba(248, 250, 252, 0.9);
            --toggle-bg: #1e293b;
            --toggle-dot: #f8fafc;
            --shadow: rgba(15, 23, 42, 0.1);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end) 40%, #1f2937);
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .badge {
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.4);
            color: #dbeafe;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .theme-toggle {
            border: none;
            background: var(--toggle-bg);
            color: var(--toggle-dot);
            border-radius: 999px;
            width: 54px;
            height: 30px;
            position: relative;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
        }
        .theme-toggle::after {
            content: "";
            position: absolute;
            top: 4px;
            left: 5px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--toggle-dot);
            transition: transform 0.25s ease;
        }
        body.light-mode .theme-toggle::after {
            transform: translateX(24px);
        }
        h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 42px);
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            margin-top: 20px;
        }
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 20px 40px var(--shadow);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }
        .stat-card {
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            background: var(--card-bg);
        }
        .stat-card:nth-child(1) { background: rgba(14, 116, 144, 0.24); }
        .stat-card:nth-child(2) { background: rgba(249, 115, 22, 0.18); }
        .stat-card:nth-child(3) { background: rgba(34, 197, 94, 0.18); }
        .stat-card .label {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .stat-card .value {
            font-size: clamp(22px, 3vw, 32px);
            font-weight: bold;
            margin-top: 10px;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 20px;
        }
        .field {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text);
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: 2px solid rgba(96, 165, 250, 0.6);
            border-color: rgba(96, 165, 250, 0.8);
        }
        button {
            grid-column: 1 / -1;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--button1), var(--button2));
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        button:hover {
            transform: translateY(-1px);
        }
        .alert-box {
            margin-top: 12px;
            padding: 18px;
            border-radius: 18px;
            border: 1px solid rgba(252, 165, 165, 0.35);
            background: linear-gradient(135deg, rgba(127, 29, 29, 0.5), rgba(69, 10, 10, 0.4));
        }
        .alert-box h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #fecaca;
        }
        .alert-box p {
            margin: 0;
            color: #fee2e2;
            line-height: 1.5;
        }
        .chart-visual {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 10px;
            height: 180px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.15);
        }
        .bar {
            flex: 1;
            border-radius: 12px 12px 0 0;
            background: linear-gradient(180deg, #60a5fa, #3b82f6);
            min-height: 30px;
            position: relative;
            animation: rise 1.2s ease-out forwards;
            transform-origin: bottom;
        }
        .bar:nth-child(2) { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
        .bar:nth-child(3) { background: linear-gradient(180deg, #34d399, #10b981); }
        .bar:nth-child(4) { background: linear-gradient(180deg, #f87171, #ef4444); }
        .chart-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            margin-top: 12px;
        }
        .risk-meter {
            margin-top: 18px;
            background: rgba(15, 23, 42, 0.35);
            border-radius: 14px;
            padding: 14px;
        }
        .meter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--muted);
        }
        .meter-track {
            height: 14px;
            background: rgba(148, 163, 184, 0.2);
            border-radius: 999px;
            overflow: hidden;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #22c55e, #facc15, #ef4444);
            transition: width 0.8s ease;
        }
        @media (max-width: 760px) {
            .dashboard { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr; }
            form { grid-template-columns: 1fr; }
            .topbar { flex-direction: column; align-items: flex-start; }
        }
        @keyframes rise {
            from { transform: scaleY(0.2); opacity: 0.3; }
            to { transform: scaleY(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>Online Payment Fraud Detection</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"></button>
        </div>

        <div class="dashboard">
            <div class="panel">
                <div class="stats">
                    <div class="stat-card">
                        <div class="label">Suspicious</div>
                        <div class="value">8.7%</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Flagged</div>
                        <div class="value">1.2K</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Secure</div>
                        <div class="value">91.3%</div>
                    </div>
                </div>

                <form method="POST" action="/predict">
                    <div class="field">
                        <label for="step">Step</label>
                        <input type="number" id="step" name="step" min="1" value="1" required>
                    </div>
                    <div class="field">
                        <label for="type">Transaction Type</label>
                        <select id="type" name="type">
                            <option value="PAYMENT">PAYMENT</option>
                            <option value="TRANSFER">TRANSFER</option>
                            <option value="CASH_OUT">CASH_OUT</option>
                            <option value="CASH_IN">CASH_IN</option>
                            <option value="DEBIT">DEBIT</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="amount">Amount</label>
                        <input type="number" step="0.01" id="amount" name="amount" min="0" value="200" required>
                    </div>
                    <div class="field">
                        <label for="oldbalanceOrg">Old Balance (Origin)</label>
                        <input type="number" step="0.01" id="oldbalanceOrg" name="oldbalanceOrg" min="0" value="5000" required>
                    </div>
                    <div class="field">
                        <label for="newbalanceOrig">New Balance (Origin)</label>
                        <input type="number" step="0.01" id="newbalanceOrig" name="newbalanceOrig" min="0" value="4800" required>
                    </div>
                    <div class="field">
                        <label for="oldbalanceDest">Old Balance (Destination)</label>
                        <input type="number" step="0.01" id="oldbalanceDest" name="oldbalanceDest" min="0" value="0" required>
                    </div>
                    <div class="field">
                        <label for="newbalanceDest">New Balance (Destination)</label>
                        <input type="number" step="0.01" id="newbalanceDest" name="newbalanceDest" min="0" value="0" required>
                    </div>
                    <button type="submit">Predict Fraud</button>
                </form>
            </div>

            <div class="panel">
                <div class="alert-box">
                    <h3>Fraud Alert</h3>
                    <p>High-risk activity is detected when balances change suddenly or when transfer patterns look abnormal.</p>
                </div>

                <div class="risk-meter" aria-live="polite">
                    <div class="meter-header">
                        <span>Risk Meter</span>
                        <strong id="riskValue">12%</strong>
                    </div>
                    <div class="meter-track">
                        <div class="meter-fill" id="riskFill"></div>
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <h3 style="margin-bottom: 12px;">Traffic Overview</h3>
                    <div class="chart-visual">
                        <div class="bar" style="height: 70%;"></div>
                        <div class="bar" style="height: 48%;"></div>
                        <div class="bar" style="height: 82%;"></div>
                        <div class="bar" style="height: 60%;"></div>
                    </div>
                    <div class="chart-labels">
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const body = document.body;
        const toggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme === 'light') {
            body.classList.add('light-mode');
        }

        toggle.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        const riskValue = document.getElementById('riskValue');
        const riskFill = document.getElementById('riskFill');
        let currentRisk = 12;

        function updateRiskMeter(value) {
            currentRisk = Math.max(0, Math.min(100, Number(value) || 0));
            riskValue.textContent = `${Math.round(currentRisk)}%`;
            riskFill.style.width = `${currentRisk}%`;
        }

        const amountInput = document.getElementById('amount');
        const balanceInput = document.getElementById('oldbalanceOrg');
        const destBalanceInput = document.getElementById('oldbalanceDest');

        function recalcRisk() {
            const amount = Number(amountInput.value || 0);
            const originBalance = Number(balanceInput.value || 0);
            const destBalance = Number(destBalanceInput.value || 0);
            let score = 12;

            if (amount > 5000) score += 20;
            if (amount > 20000) score += 20;
            if (originBalance > 50000) score += 10;
            if (destBalance > 2000) score += 15;
            if (destBalance === 0 && amount > 1000) score += 10;

            updateRiskMeter(score);
        }

        [amountInput, balanceInput, destBalanceInput].forEach((el) => {
            el.addEventListener('input', recalcRisk);
        });

        updateRiskMeter(currentRisk);
    </script>
</body>
</html>
